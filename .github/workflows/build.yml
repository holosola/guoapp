name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
        continue-on-error: true

      - run: dart analyze lib test integration_test test_driver
        continue-on-error: true

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: true

      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
        continue-on-error: true

      - run: go test -race ./...
        working-directory: native
        continue-on-error: true

      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
        continue-on-error: true

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true

      - run: sdkmanager 'ndk;28.2.13676358'

      - name: Configure Android signing
        id: signing
        shell: bash
        run: |
          python scripts/configure_signing.py
          if [ -f android/key.properties ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置发布签名 Secrets，本次 APK 使用 debug 签名，仅供测试，不可用于正式分发。"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Android
        shell: bash
        run: python scripts/build_android.py ${{ matrix.arguments }}

      - name: Verify APK signing certificate
        if: steps.signing.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ vars.ANDROID_CERT_SHA256 }}'

          if [ -z "$expected" ]; then
            echo "未设置仓库变量 ANDROID_CERT_SHA256，跳过证书指纹比对。"
            exit 0
          fi

          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n1 || true)

          if [ -z "$apksigner" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n1)
          fi

          for apk in dist/android/*.apk; do
            [ -f "$apk" ] || continue
            echo "== $(basename "$apk")"
            output=$("$apksigner" verify --print-certs "$apk" 2>&1)
            printf '%s\n' "$output"

            if ! printf '%s' "$output" | tr -d ':' | tr '[:upper:]' '[:lower:]' | grep -qi "$expected"; then
              echo "签名证书与发布证书不一致，已终止。" >&2
              exit 1
            fi
          done

      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Verify Windows build toolchain
        shell: pwsh
        run: |
          flutter doctor -v
          go version
          python --version

      - name: Build Windows
        shell: pwsh
        run: python scripts/build_windows.py ${{ matrix.arguments }}

      - name: Verify Windows package
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist/windows -Filter *.zip -File
          if (-not $files) {
            throw "未找到 Windows ZIP 安装包，请检查 scripts/package_release.py 的输出目录。"
          }
          $files | ForEach-Object {
            Write-Host "$($_.Name) $($_.Length) bytes"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [android, windows]
    if: always() && needs.android.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts

      - name: Generate release files and checksums
        shell: bash
        run: |
          set -euo pipefail

          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          mkdir -p release

          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            name=$(basename "$file")
            if [ "$name" = "SHA256SUMS.txt" ]; then
              continue
            fi
            cp "$file" "release/$name"
          done

          cd release
          mapfile -t files < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有可发布的构建产物。" >&2
            exit 1
          fi

          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        shell: bash
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail

          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)

          {
            printf '%s\n\n' "版本 ${version}。两个版本功能相同，区别只在站源范围："
            printf '%s\n' "- 红果鉴 hongguojian：仅红果站源"
            printf '%s\n' "- 真果鉴 zhenguojian：全部站源"

            printf '\n%s\n' "Android："
            if [ -n "$ANDROID_CERT_SHA256" ]; then
              printf '%s\n' "APK 使用配置的发布签名证书，可在签名一致时覆盖安装升级。"
            else
              printf '%s\n' "APK 使用 debug 签名，仅供测试，不能覆盖正式签名版本安装。"
            fi
            printf '%s\n' "- *-arm64-v8a.apk：绝大多数手机"
            printf '%s\n' "- *-armeabi-v7a.apk：较老的 32 位手机"
            printf '%s\n' "- *-x86_64.apk：模拟器"

            printf '\n%s\n' "Windows 10/11 x64："
            printf '%s\n' "- hongguojian-windows-x64.zip：红果站源版本"
            printf '%s\n' "- zhenguojian-windows-x64.zip：全部站源版本"
            printf '%s\n' "解压 ZIP 后运行对应的 hongguojian.exe 或 zhenguojian.exe。"

            printf '\n%s\n' "SHA256SUMS.txt：所有发布文件的 SHA-256 校验值。"
          } > notes.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          tag="app-v${version//+/-}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" \
              --title "红果鉴 / 真果鉴 ${version}" \
              --notes-file release/notes.md
          else
            gh release create "$tag" release/* \
              --title "红果鉴 / 真果鉴 ${version}" \
              --notes-file release/notes.md
          fi

          # 删除已不再生成的旧附件，避免下载到过期版本。
          for name in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
            if [ ! -e "release/$name" ]; then
              gh release delete-asset "$tag" "$name" --yes
            fi
          done
